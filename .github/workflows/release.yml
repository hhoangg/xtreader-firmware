name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release: plain
# firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for every other
# board. Attach the artifacts' .bin files to the release as-is.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
          - pio_env: sticky-gh_release
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    name: Publish GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    # The build job only uploads workflow artifacts, which OtaUpdater cannot see:
    # it fetches /releases/latest and reads the release's asset list. This job is
    # what actually turns a pushed tag into something a device can update to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches platformio.ini
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # CROSSPOINT_VERSION is baked in from [crosspoint] version, not from the
          # tag, so a mismatch ships a firmware that reports the old version. The
          # device would then see this release as newer forever and re-update on
          # every check.
          declared="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' platformio.ini | head -1)"
          if [ "${TAG#v}" != "$declared" ]; then
            echo "tag ${TAG} does not match [crosspoint] version ${declared}" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Flatten the per-board artifact directories. Each holds exactly one
          # firmware*.bin, already named the way OtaUpdater asks for it
          # (firmware.bin for X4/X3, firmware-<board>.bin otherwise), so the
          # names stay untouched and cannot collide.
          find artifacts -name 'firmware*.bin' -exec cp {} . \;
          ls -l firmware*.bin
          # A tag carrying "rc" ships as a prerelease: GitHub omits prereleases
          # from /releases/latest, which is the only endpoint OtaUpdater reads,
          # so release candidates never reach a device that did not ask for one.
          prerelease=""
          case "$TAG" in
            *rc*) prerelease="--prerelease" ;;
          esac
          # Idempotent: re-running the workflow on a tag that already has a
          # release must not fail. `gh release create` refuses with "a release
          # with the same tag name already exists", which is exactly how this
          # job failed the first time it ran -- the release had been published
          # by hand while Actions was still disabled on the fork.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" firmware*.bin \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              $prerelease \
              firmware*.bin
          fi
