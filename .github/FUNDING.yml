# The "Sponsor this project" panel on the repository page.
#
# Two entries, in the order they matter to somebody standing on THIS repo.
#
# `ko_fi` funds this fork: the sync integration, the wallpaper gallery, and
# keeping the fork current with upstream. `custom` is upstream's own funding
# link, inherited when this was forked and deliberately kept -- every line of
